name: Generate Ownership Matrix

# Implements the automation Doc 07 §3 already claims exists: a master table
# at 03_RESOURCES/Company_Master_Standards/Ownership-Matrix.md listing every
# active document's Code, Title, Department, and Owner. Reuses the same
# file-scanning pattern as dashboard-generate.yml.

on:
  push:
    branches: [main]
    paths:
      - '01_AREAS/**/*.md'
      - '02_PROJECTS/**/*.md'
      - '03_RESOURCES/**/*.md'
  workflow_dispatch: {}

jobs:
  build-ownership-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate Ownership-Matrix.md
        run: |
          OUT="03_RESOURCES/Company_Master_Standards/Ownership-Matrix.md"
          echo "# Ownership Matrix" > "$OUT"
          echo "" >> "$OUT"
          echo "_Auto-generated by ownership-matrix-generate.yml — do not edit by hand._" >> "$OUT"
          echo "" >> "$OUT"
          echo "| Code | Title | Department | Owner |" >> "$OUT"
          echo "|---|---|---|---|" >> "$OUT"

          for file in $(find 01_AREAS 02_PROJECTS 03_RESOURCES -name "*.md" ! -name "README.md" ! -name "Glossary.md" ! -name "FAQ.md" ! -name "Ownership-Matrix.md" | sort); do
            status=$(grep -m1 "^Lifecycle Status:" "$file" | sed 's/Lifecycle Status:[[:space:]]*//')
            [[ "$status" == "Retired" ]] && continue

            code=$(grep -m1 "^Code:" "$file" | sed 's/Code:[[:space:]]*//')
            title=$(grep -m1 "^Title:" "$file" | sed 's/Title:[[:space:]]*//')
            dept=$(grep -m1 "^Department:" "$file" | sed 's/Department:[[:space:]]*//')
            owner=$(grep -m1 "^Owner (Accountable):" "$file" | sed 's/Owner (Accountable):[[:space:]]*//')

            [[ -z "$code" ]] && continue
            echo "| $code | $title | $dept | $owner |" >> "$OUT"
          done

      - name: Commit updated matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "03_RESOURCES/Company_Master_Standards/Ownership-Matrix.md"
          git diff --cached --quiet || git commit -m "chore: regenerate Ownership-Matrix.md"
          git push
