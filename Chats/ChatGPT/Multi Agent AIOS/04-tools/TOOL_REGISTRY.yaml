version: "1.0"
status: v1.0
purpose: Canonical Tier-1 registry for tools exposed to AIOS agents.

rules:
  authorization_chain: "agent -> skill -> tool -> action"
  default_access: deny
  least_privilege: true
  secrets_in_repository: false
  every_tool_requires_owner: true
  every_tool_requires_version: true
  every_tool_requires_healthcheck: true
  every_write_action_requires_audit: true

permission_classes:
  - read
  - write
  - execute
  - export
  - admin

entries:
  - tool_id: TOOL-ODOO-CRM
    name: Odoo CRM
    category: business_operations
    system_of_record: true
    permissions: [read, write]
    status: planned
    owner: platform_operations
    version: "1.0"
    healthcheck: required
    notes: Canonical CRM interface for governed customer and opportunity operations.

  - tool_id: TOOL-ODOO-SALES
    name: Odoo Sales
    category: business_operations
    system_of_record: true
    permissions: [read, write]
    status: planned
    owner: finance_operations
    version: "1.0"
    healthcheck: required
    notes: Sales-order and commercial transaction operations subject to approval policy.

  - tool_id: TOOL-ODOO-ACCOUNTING
    name: Odoo Accounting
    category: finance
    system_of_record: true
    permissions: [read, write]
    status: planned
    owner: finance_operations
    version: "1.0"
    healthcheck: required
    notes: Financial records are authoritative in Odoo; material financial actions require policy-controlled approval.

  - tool_id: TOOL-ODOO-SEARCH-LEAD
    name: odoo.search_lead
    category: crm
    system_of_record: true
    permissions: [read]
    status: planned
    owner: sales_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [query]
      fields:
        query: string
        limit: integer
        filters: object
    output_schema:
      type: object
      fields: [leads, total]
    audit: read_access_logged
    notes: Governed read-only lead search against Odoo CRM.

  - tool_id: TOOL-ODOO-CREATE-LEAD
    name: odoo.create_lead
    category: crm
    system_of_record: true
    permissions: [write]
    status: planned
    owner: sales_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [lead]
      fields:
        lead: object
    output_schema:
      type: object
      fields: [lead_id, record, created]
    audit: required
    idempotency: required
    notes: Creates a governed lead record in Odoo CRM.

  - tool_id: TOOL-ODOO-UPDATE-LEAD
    name: odoo.update_lead
    category: crm
    system_of_record: true
    permissions: [write]
    status: planned
    owner: sales_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [lead_id, changes]
      fields:
        lead_id: string
        changes: object
    output_schema:
      type: object
      fields: [lead_id, record, updated]
    audit: required
    idempotency: required
    notes: Updates an existing Odoo lead subject to authorization and field-level policy.

  - tool_id: TOOL-ODOO-CREATE-OPPORTUNITY
    name: odoo.create_opportunity
    category: crm
    system_of_record: true
    permissions: [write]
    status: planned
    owner: sales_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [opportunity]
      fields:
        opportunity: object
    output_schema:
      type: object
      fields: [opportunity_id, record, created]
    audit: required
    idempotency: required
    notes: Creates an opportunity in Odoo CRM after qualification and policy checks.

  - tool_id: TOOL-POSTGRES-QUERY-READONLY
    name: postgres.query_readonly
    category: data
    system_of_record: false
    permissions: [read]
    status: planned
    owner: data_platform
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [query]
      fields:
        query: string
        parameters: array
        max_rows: integer
    output_schema:
      type: object
      fields: [rows, row_count]
    audit: required
    safety:
      write_statements_allowed: false
      destructive_statements_allowed: false
    notes: Read-only analytical/query interface to PostgreSQL.

  - tool_id: TOOL-POSTGRES-WRITE-EVENT
    name: postgres.write_event
    category: data
    system_of_record: true
    permissions: [write]
    status: planned
    owner: data_platform
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [event]
      fields:
        event: object
    output_schema:
      type: object
      fields: [event_id, persisted]
    audit: required
    idempotency: required
    notes: Persists governed event records to the canonical event store.

  - tool_id: TOOL-FIRECRAWL-EXTRACT
    name: firecrawl.extract
    category: research
    system_of_record: false
    permissions: [execute]
    status: planned
    owner: research_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [url]
      fields:
        url: string
        schema: object
        formats: array
        max_depth: integer
    output_schema:
      type: object
      fields: [data, sources, metadata]
    audit: required
    safety:
      allowed_domains_required: true
      secrets_in_input: false
    notes: Structured web extraction for governed research and lead-intelligence workflows.

  - tool_id: TOOL-BROWSER-USE-RESEARCH
    name: browser_use.research
    category: research
    system_of_record: false
    permissions: [execute]
    status: planned
    owner: research_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [task]
      fields:
        task: string
        allowed_domains: array
        max_steps: integer
    output_schema:
      type: object
      fields: [findings, sources, actions_taken]
    audit: required
    safety:
      destructive_actions_allowed: false
      external_submission_allowed: false
      allowed_domains_required: true
    notes: Browser-based research tool restricted to approved research actions and domains.

  - tool_id: TOOL-MAUTIC-SEND-EMAIL
    name: mautic.send_email
    category: communication
    system_of_record: false
    permissions: [execute]
    status: planned
    owner: marketing_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [recipient, message]
      fields:
        recipient: string
        subject: string
        message: object
        campaign_id: string
    output_schema:
      type: object
      fields: [message_id, accepted, status]
    audit: required
    safety:
      consent_required: true
      suppression_check_required: true
    notes: Governed outbound email execution through Mautic.

  - tool_id: TOOL-POSTAL-SEND-TRANSACTIONAL
    name: postal.send_transactional
    category: communication
    system_of_record: false
    permissions: [execute]
    status: planned
    owner: communications_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [recipient, template]
      fields:
        recipient: string
        template: string
        variables: object
        idempotency_key: string
    output_schema:
      type: object
      fields: [message_id, accepted, status]
    audit: required
    safety:
      suppression_check_required: true
    notes: Transactional email transport; marketing consent logic remains upstream.

  - tool_id: TOOL-CAL-CREATE-BOOKING
    name: cal.create_booking
    category: scheduling
    system_of_record: false
    permissions: [execute]
    status: planned
    owner: revenue_operations
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [event_type, start_time, attendee]
      fields:
        event_type: string
        start_time: datetime
        attendee: object
        timezone: string
    output_schema:
      type: object
      fields: [booking_id, status, meeting_url]
    audit: required
    idempotency: required
    notes: Creates approved calendar bookings for sales and operational workflows.

  - tool_id: TOOL-QDRANT-SEARCH
    name: qdrant.search
    category: vector_retrieval
    system_of_record: false
    permissions: [read]
    status: planned
    owner: data_platform
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [collection, vector]
      fields:
        collection: string
        vector: array
        limit: integer
        filter: object
        score_threshold: number
    output_schema:
      type: object
      fields: [matches, collection, count]
    audit: required
    safety:
      source_of_truth: false
      tenant_scope_required: true
    notes: Governed semantic retrieval from Qdrant; source records remain authoritative elsewhere.

  - tool_id: TOOL-QDRANT-UPSERT
    name: qdrant.upsert
    category: vector_retrieval
    system_of_record: false
    permissions: [write]
    status: planned
    owner: data_platform
    version: "1.0"
    healthcheck: required
    input_schema:
      required: [collection, points]
      fields:
        collection: string
        points: array
        wait: boolean
    output_schema:
      type: object
      fields: [operation_id, status, upserted_count]
    audit: required
    idempotency: required
    safety:
      source_of_truth: false
      tenant_scope_required: true
    notes: Writes derived embeddings and payload metadata to Qdrant; canonical source data must remain in its system of record.

runtime_requirements:
  - validate_tool_is_registered
  - validate_agent_skill_mapping
  - validate_permission
  - validate_tenant_scope
  - validate_input_schema
  - enforce_approval_policy
  - enforce_idempotency_for_writes
  - emit_audit_record
  - verify_postcondition
  - record_execution_result

change_control:
  breaking_changes: require_version_bump_and_compatibility_review
  permission_changes: require_security_review
  system_of_record_changes: require_data_governance_review
  production_activation: require_healthcheck_and_evaluation

completion:
  tier: Tier-1
  target_tools: 15
  registered_tools: 15
  status: complete
