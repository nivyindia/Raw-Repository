# BILLION DREAMS UNITED OS — CANONICAL DATA MODEL
# Stage B.5 | Version 1.1 | 2026-09-01
# Common identity/audit fields standardized across all 30 entities.

version: "1.1"
status: "common-fields-standardized"

common_fields:
  id: {type: string, required: true, immutable: true, description: "Stable canonical entity identifier"}
  company_id: {type: string, required: true, indexed: true, description: "Owning company/tenant scope"}
  brand_id: {type: string, required: false, indexed: true, description: "Brand scope where applicable"}
  created_at: {type: datetime, required: true, immutable: true}
  updated_at: {type: datetime, required: true}

field_conventions:
  ids: "Opaque stable strings; never silently reused"
  timestamps: "ISO-8601 UTC"
  dates: "ISO-8601 date"
  currency: "ISO 4217 code"
  emails: "Normalized lowercase representation where technically appropriate"
  status: "Controlled vocabulary defined by each entity's lifecycle"
  references: "Store canonical ID, not display name"

entity_field_overrides:
  Lead: {required_additional: [source, status], sensitive: [email, phone]}
  Account: {required_additional: [name, status]}
  Opportunity: {required_additional: [account_id, name, stage]}
  Contact: {required_additional: [first_name, status], sensitive: [email, phone]}
  Project: {required_additional: [account_id, name, status]}
  Invoice: {required_additional: [account_id, invoice_number, issue_date, due_date, status, subtotal, total_amount, currency]}
  Company: {required_additional: [name, country, status]}
  Brand: {required_additional: [company_id, name, status]}
  Client: {required_additional: [account_id, status]}
  Campaign: {required_additional: [name, channel, objective, status]}
  Meeting: {required_additional: [scheduled_at, meeting_type, status]}
  Proposal: {required_additional: [opportunity_id, version, title, status]}
  Contract: {required_additional: [account_id, contract_number, status]}
  Payment: {required_additional: [account_id, amount, currency, payment_date, status]}
  Task: {required_additional: [title, status]}
  Ticket: {required_additional: [subject, description, priority, status]}
  Agent: {required_additional: [name, purpose, status, version]}
  AgentRun: {required_additional: [agent_id, status, started_at]}
  Skill: {required_additional: [name, version, status]}
  Tool: {required_additional: [name, provider, status]}
  Workflow: {required_additional: [name, trigger_type, status, version]}
  WorkflowRun: {required_additional: [workflow_id, status, started_at]}
  Event: {required_additional: [event_type, source, entity_type, entity_id, occurred_at]}
  Evaluation: {required_additional: [subject_type, subject_id, evaluator, criteria_version, status]}
  Approval: {required_additional: [subject_type, subject_id, requested_by, status, requested_at]}
  Incident: {required_additional: [severity, category, title, status]}
  Department: {required_additional: [name, purpose, status]}
  User: {required_additional: [email, display_name, role, status]}
  Employee: {required_additional: [user_id, employee_number, job_title, department_id, status]}
  Partner: {required_additional: [name, partner_type, status]}

relationships:
  - {from: Lead, to: Account, type: may_convert_to}
  - {from: Account, to: Contact, type: has_many}
  - {from: Account, to: Opportunity, type: has_many}
  - {from: Opportunity, to: Project, type: may_create}
  - {from: Account, to: Project, type: has_many}
  - {from: Project, to: Invoice, type: may_generate}
  - {from: Account, to: Invoice, type: has_many}
  - {from: Company, to: Brand, type: has_many}
  - {from: Brand, to: Campaign, type: has_many}
  - {from: Account, to: Client, type: may_become}
  - {from: Opportunity, to: Meeting, type: may_generate}
  - {from: Opportunity, to: Proposal, type: has_many}
  - {from: Account, to: Contract, type: has_many}
  - {from: Invoice, to: Payment, type: has_many}
  - {from: Client, to: Ticket, type: has_many}
  - {from: Project, to: Task, type: has_many}
  - {from: Agent, to: AgentRun, type: has_many}
  - {from: Agent, to: Skill, type: uses}
  - {from: Agent, to: Tool, type: may_use}
  - {from: Workflow, to: WorkflowRun, type: has_many}
  - {from: WorkflowRun, to: AgentRun, type: may_contain}
  - {from: Event, to: Workflow, type: may_trigger}
  - {from: Evaluation, to: Agent, type: evaluates}
  - {from: Approval, to: AgentRun, type: may_gate}
  - {from: Incident, to: WorkflowRun, type: may_reference}
  - {from: Department, to: Employee, type: has_many}
  - {from: User, to: Employee, type: may_map_to}
  - {from: Company, to: Partner, type: has_many}

notes:
  - "Entity-specific fields from B.4 remain part of the canonical schema; common_fields are inherited unless explicitly overridden."
  - "No secrets or credentials are data-model fields."
  - "Sensitive personal/contact fields require appropriate access controls and retention policies."
