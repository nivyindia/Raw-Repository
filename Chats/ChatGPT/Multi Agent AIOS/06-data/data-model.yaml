# BILLION DREAMS UNITED OS — CANONICAL DATA MODEL
# Stage B.4 | Version 1.0 | 2026-09-01
# All 30 canonical entities. B.5 will standardize common fields explicitly.

version: "1.0"
status: "complete-entity-schema"
entities:
  Lead: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, source, source_url, first_name, last_name, email, phone, company_name, job_title, country, status, score, assigned_to]}
  Account: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, name, legal_name, website, industry, country, status, owner_id]}
  Opportunity: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, account_id, contact_id, name, stage, amount, currency, probability, expected_close_date, owner_id, source]}
  Contact: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, account_id, first_name, last_name, email, phone, job_title, country, status]}
  Project: {domain: delivery, fields: [id, company_id, brand_id, created_at, updated_at, account_id, opportunity_id, name, status, start_date, target_end_date, project_manager_id, budget, currency]}
  Invoice: {domain: finance, fields: [id, company_id, brand_id, created_at, updated_at, account_id, project_id, invoice_number, issue_date, due_date, status, subtotal, tax_amount, total_amount, currency, paid_at]}
  Company: {domain: organization, fields: [id, company_id, brand_id, created_at, updated_at, name, legal_name, registration_number, country, status]}
  Brand: {domain: organization, fields: [id, company_id, brand_id, created_at, updated_at, name, website, market, status]}
  Client: {domain: customer, fields: [id, company_id, brand_id, created_at, updated_at, account_id, primary_contact_id, onboarding_date, status, success_owner_id]}
  Campaign: {domain: marketing, fields: [id, company_id, brand_id, created_at, updated_at, name, channel, objective, status, start_date, end_date, budget]}
  Meeting: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, account_id, opportunity_id, contact_id, scheduled_at, duration_minutes, meeting_type, status, owner_id]}
  Proposal: {domain: sales, fields: [id, company_id, brand_id, created_at, updated_at, opportunity_id, version, title, amount, currency, status, sent_at, expires_at]}
  Contract: {domain: legal, fields: [id, company_id, brand_id, created_at, updated_at, account_id, opportunity_id, contract_number, status, effective_date, expiry_date, value, currency]}
  Payment: {domain: finance, fields: [id, company_id, brand_id, created_at, updated_at, account_id, invoice_id, amount, currency, payment_date, method, status, reference]}
  Task: {domain: operations, fields: [id, company_id, brand_id, created_at, updated_at, title, description, status, priority, assignee_id, due_date, related_entity_type, related_entity_id]}
  Ticket: {domain: support, fields: [id, company_id, brand_id, created_at, updated_at, account_id, client_id, subject, description, priority, status, assignee_id, resolved_at]}
  Agent: {domain: ai, fields: [id, company_id, brand_id, created_at, updated_at, name, purpose, status, version, owner_id, policy_id]}
  AgentRun: {domain: ai, fields: [id, company_id, brand_id, created_at, updated_at, agent_id, workflow_run_id, input_ref, output_ref, status, started_at, completed_at, error_code]}
  Skill: {domain: ai, fields: [id, company_id, brand_id, created_at, updated_at, name, description, version, status, agent_id]}
  Tool: {domain: platform, fields: [id, company_id, brand_id, created_at, updated_at, name, provider, endpoint, auth_type, status, permission_scope]}
  Workflow: {domain: automation, fields: [id, company_id, brand_id, created_at, updated_at, name, trigger_type, status, version, owner_id, definition_ref]}
  WorkflowRun: {domain: automation, fields: [id, company_id, brand_id, created_at, updated_at, workflow_id, status, started_at, completed_at, error_code, execution_ref]}
  Event: {domain: platform, fields: [id, company_id, brand_id, created_at, updated_at, event_type, source, entity_type, entity_id, payload_ref, occurred_at]}
  Evaluation: {domain: governance, fields: [id, company_id, brand_id, created_at, updated_at, subject_type, subject_id, evaluator, criteria_version, score, status, evidence_ref]}
  Approval: {domain: governance, fields: [id, company_id, brand_id, created_at, updated_at, subject_type, subject_id, requested_by, approver_id, status, requested_at, decided_at, decision_ref]}
  Incident: {domain: governance, fields: [id, company_id, brand_id, created_at, updated_at, severity, category, title, description, status, owner_id, resolved_at]}
  Department: {domain: organization, fields: [id, company_id, brand_id, created_at, updated_at, name, purpose, parent_department_id, owner_id, status]}
  User: {domain: identity, fields: [id, company_id, brand_id, created_at, updated_at, email, display_name, role, status, external_ref]}
  Employee: {domain: people, fields: [id, company_id, brand_id, created_at, updated_at, user_id, employee_number, job_title, department_id, status, manager_id]}
  Partner: {domain: ecosystem, fields: [id, company_id, brand_id, created_at, updated_at, name, partner_type, website, country, status, owner_id]}

relationships:
  - {from: Lead, to: Account, type: may_convert_to}
  - {from: Account, to: Contact, type: has_many}
  - {from: Account, to: Opportunity, type: has_many}
  - {from: Opportunity, to: Project, type: may_create}
  - {from: Account, to: Project, type: has_many}
  - {from: Project, to: Invoice, type: may_generate}
  - {from: Account, to: Invoice, type: has_many}
  - {from: Company, to: Brand, type: has_many}
  - {from: Brand, to: Campaign, type: has_many}
  - {from: Account, to: Client, type: may_become}
  - {from: Opportunity, to: Meeting, type: may_generate}
  - {from: Opportunity, to: Proposal, type: has_many}
  - {from: Account, to: Contract, type: has_many}
  - {from: Invoice, to: Payment, type: has_many}
  - {from: Client, to: Ticket, type: has_many}
  - {from: Project, to: Task, type: has_many}
  - {from: Agent, to: AgentRun, type: has_many}
  - {from: Agent, to: Skill, type: uses}
  - {from: Agent, to: Tool, type: may_use}
  - {from: Workflow, to: WorkflowRun, type: has_many}
  - {from: WorkflowRun, to: AgentRun, type: may_contain}
  - {from: Event, to: Workflow, type: may_trigger}
  - {from: Evaluation, to: Agent, type: evaluates}
  - {from: Approval, to: AgentRun, type: may_gate}
  - {from: Incident, to: WorkflowRun, type: may_reference}
  - {from: Department, to: Employee, type: has_many}
  - {from: User, to: Employee, type: may_map_to}
  - {from: Company, to: Partner, type: has_many}
