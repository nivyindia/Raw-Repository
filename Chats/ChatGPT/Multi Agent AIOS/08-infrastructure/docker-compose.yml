name: billion-dreams-united-aios-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [aios]

  odoo:
    image: odoo:19
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8069:8069"]
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks: [aios]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-change-me-dev-only}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-dev-encryption-key}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      AIOS_RUNTIME_URL: ${AIOS_RUNTIME_URL:-http://aios-runtime:8080}
      ODOO_SYNC_URL: ${ODOO_SYNC_URL:-http://odoo-sync:8091}
      AIOS_N8N_BASE_URL: ${AIOS_N8N_BASE_URL:-http://n8n:5678}
    volumes: [n8n_data:/home/node/.n8n]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [aios]

  aios-runtime:
    build: {context: ../09-runtime}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
      langgraph-adapter:
        condition: service_started
      crewai-adapter:
        condition: service_started
      hermes-adapter:
        condition: service_started
      dify-adapter:
        condition: service_started
    ports: ["8080:8080"]
    environment:
      AIOS_DATABASE_URL: postgresql://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD:-change-me-dev-only}@postgres:5432/${POSTGRES_DB:-odoo}
      N8N_RUNTIME_URL: ${N8N_RUNTIME_URL:-http://n8n:5678}
      LANGGRAPH_RUNTIME_URL: ${LANGGRAPH_RUNTIME_URL:-http://langgraph-adapter:8090}
      CREWAI_RUNTIME_URL: ${CREWAI_RUNTIME_URL:-http://crewai-adapter:8090}
      HERMES_RUNTIME_URL: ${HERMES_RUNTIME_URL:-http://hermes-adapter:8090}
      DIFY_RUNTIME_URL: ${DIFY_RUNTIME_URL:-http://dify-adapter:8090}
      RUNTIME_TIMEOUT_SECONDS: ${RUNTIME_TIMEOUT_SECONDS:-120}
    networks: [aios]

  langgraph-adapter:
    build:
      context: ../09-runtime
      dockerfile: adapters/Dockerfile
    restart: unless-stopped
    environment:
      RUNTIME_KIND: langgraph
      RUNTIME_TARGET_URL: ${LANGGRAPH_TARGET_URL:-}
      RUNTIME_API_KEY: ${LANGGRAPH_API_KEY:-}
      LANGGRAPH_ASSISTANT_ID: ${LANGGRAPH_ASSISTANT_ID:-}
      LANGGRAPH_INVOKE_PATH: ${LANGGRAPH_INVOKE_PATH:-/runs/wait}
    networks: [aios]

  crewai-adapter:
    build:
      context: ../09-runtime
      dockerfile: adapters/Dockerfile
    restart: unless-stopped
    environment:
      RUNTIME_KIND: crewai
      RUNTIME_TARGET_URL: ${CREWAI_TARGET_URL:-}
      RUNTIME_API_KEY: ${CREWAI_API_KEY:-}
    networks: [aios]

  hermes-adapter:
    build:
      context: ../09-runtime
      dockerfile: adapters/Dockerfile
    restart: unless-stopped
    environment:
      RUNTIME_KIND: hermes
      RUNTIME_TARGET_URL: ${HERMES_TARGET_URL:-}
      RUNTIME_API_KEY: ${HERMES_API_KEY:-}
    networks: [aios]

  dify-adapter:
    build:
      context: ../09-runtime
      dockerfile: adapters/Dockerfile
    restart: unless-stopped
    environment:
      RUNTIME_KIND: dify
      RUNTIME_TARGET_URL: ${DIFY_TARGET_URL:-}
      RUNTIME_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORKFLOW_ID: ${DIFY_WORKFLOW_ID:-}
      DIFY_INVOKE_PATH: ${DIFY_INVOKE_PATH:-/workflows/run}
    networks: [aios]

  odoo-sync:
    build:
      context: ../09-runtime
      dockerfile: adapters/odoo-Dockerfile
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      ODOO_URL: ${ODOO_URL:-http://odoo:8069}
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_USERNAME: ${ODOO_USERNAME:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
    networks: [aios]

volumes:
  postgres_data:
  odoo_data:
  n8n_data:

networks:
  aios:
    driver: bridge
