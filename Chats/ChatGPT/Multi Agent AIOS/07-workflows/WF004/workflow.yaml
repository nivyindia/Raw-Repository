id: WF004
name: Lead Verification
version: 1.0.0
status: spec_ready
trigger: lead.enriched
inputs: [lead_id, email, domain, enrichment]
outputs: [verification_status, verification_score, issues]
steps: [validate_schema, verify_email_domain, verify_company, confidence_gate, update_crm, emit]
tools: [postgres.query_readonly, odoo.update_lead, postgres.write_event]
error_policy: retry_3_then_dead_letter
approval: none
events_emitted: [lead.verified]
