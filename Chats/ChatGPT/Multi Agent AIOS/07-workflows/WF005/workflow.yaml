id: WF005
name: Lead Scoring
version: 1.0.0
status: spec_ready
trigger: lead.verified
inputs: [lead_id, firmographic_data, engagement, intent, verification_score]
outputs: [score, score_band, routing]
steps: [load_features, calculate_score, apply_thresholds, update_crm, emit]
tools: [postgres.query_readonly, odoo.update_lead, postgres.write_event]
error_policy: retry_3_then_dead_letter
approval: none
events_emitted: [lead.qualified_for_segmentation]
